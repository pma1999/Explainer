# Koyeb configuration for Explainer API
# This file defines the deployment configuration for Koyeb's free tier (Starter plan)
#
# Features:
# - Scale-to-zero: App stops after inactivity to save resources (free)
# - Autoscaling: Automatically scales up when needed
# - Region: Frankfurt (fra) - close to Supabase EU regions
# - Port: 8000 (Koyeb free tier health check requirement)
#
# Impacto del proveedor Codex / ChatGPT (T08) - SOLO documental, sin cambios funcionales:
# - La imagen incluye el binario standalone `codex` (musl, /usr/local/bin/codex, pin 0.147.0),
#   sin Node. El app-server de Codex se lanza por tenant via CODEX_BIN_PATH.
# - Presupuesto de memoria (instancia nano 512MB): Python + uvicorn ~200 MB, mas hasta
#   CODEX_MAX_PROCESSES=3 procesos `codex app-server` (~80-150 MB RSS cada uno segun carga).
#   Si se observan OOM, bajar CODEX_MAX_PROCESSES (env de Koyeb, sin tocar este archivo).
# - Env de ajuste (opcionales, con defaults en el backend): CODEX_MAX_PROCESSES=3,
#   CODEX_PER_PROCESS_MAX_CONCURRENCY=5, CODEX_IDLE_TTL_SECONDS=600,
#   CODEX_REQUEST_TIMEOUT_SECONDS=900, CODEX_LINK_TIMEOUT_SECONDS=600,
#   CODEX_SPAWN_WAIT_SECONDS=60, CODEX_BIN_PATH=/usr/local/bin/codex.
# - El vinculo ChatGPT (auth.json cifrado) vive en Supabase (user_provider_connections),
#   por lo que sobrevive a cold starts de scale-to-zero: al reactivar la app se restaura
#   desde la base de datos, no desde el disco local del contenedor.

name: explainer
region: fra
type: web

# Use Docker builder since we have a Dockerfile
docker:
  dockerfile: Dockerfile

# Port configuration - Koyeb free tier requires port 8000
ports:
  - port: 8000
    protocol: http
    expose: true

# Routes
routes:
  - path: /
    port: 8000

# Static environment variables (non-sensitive)
env:
  - name: ENVIRONMENT
    value: production
  - name: PORT
    value: "8000"
  - name: KOYEB_APP_NAME
    value: explainer

# Scaling configuration for free tier
scaling:
  min: 0  # Scale-to-zero: app stops after ~5 min of inactivity (FREE)
  max: 1  # Only 1 instance (free tier limit)
  targets:
    - type: cpu
      value: 80  # Scale up when CPU reaches 80%

# Health check - must be on port 8000 for free tier
healthcheck:
  protocol: http
  port: 8000
  path: /healthz
  method: GET
  grace_period: 30
  interval: 15
  timeout: 5
  retries: 3

# Instance type (free tier uses nano by default)
instance_types:
  - type: nano

# IMPORTANT: Secrets must be configured separately via Koyeb CLI or dashboard:
# - APP_ENCRYPTION_KEY
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - SUPABASE_JWT_SECRET
# - FRONTEND_URL
#
# To set secrets via CLI:
#   koyeb secret create APP_ENCRYPTION_KEY --value "your-key-here"
#   koyeb secret create SUPABASE_URL --value "https://xxx.supabase.co"
#   ... etc
#
# Then attach them to the service:
#   koyeb service update explainer-api/explainer-api --secret APP_ENCRYPTION_KEY
#   ... etc
