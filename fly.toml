# fly.toml app configuration file generated for explainer-api-pablo on 2026-02-21T15:44:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'explainer-api-pablo'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "10s"
  interval = "5s"
  method = "GET"
  path = "/api/settings/api-key/status"
  port = 8080
  timeout = "2s"
  tls_skip_verify = false
  [http_service.checks.headers]
    Accept = "application/json"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
