app = 'explainer-api'
primary_region = 'mad'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = '8080'
  ENVIRONMENT = 'production'
  # FRONTEND_URL se configura tras desplegar Vercel

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[mounts]]
  source = "explainer_data"
  destination = "/app/data"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
