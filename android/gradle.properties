# Daemon JVM: JDK 17 del entorno (JAVA_HOME=~/jdk-17).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX obligatorio con AGP 9.
android.useAndroidX=true
android.nonTransitiveRClass=true

# T12: AGP 9.0 cambió android.onlyEnableUnitTestForTheTestedBuildType a true
# (solo la build type probada —debug— recibe tareas de unit test). El brief T12
# exige testReleaseUnitTest verde (unit tests también en release), así que se
# restaura el comportamiento AGP 8.x: unit tests para debug Y release.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official
