<!DOCTYPE html>
<html lang="es">
<!--
  Documento local exclusivo para Mermaid (T08, integration-content-rendering.md).
  Única URL de entrada: el host/path de assets del contrato (WebViewAssetLoader),
  servida por WebViewAssetLoader. Sin CDN, sin bridges, sin subrequests externos.
-->
<head>
  <meta charset="utf-8">
  <!-- CSP exacta del contrato: sin fuentes remotas; style inline permitido
       (Mermaid inyecta <style> y atributos en el SVG generado). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <title>Esquema visual</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Paleta académica T05: papel/tinta (ExplainerColors.Light/Dark surfaces). */
    body.theme-light { background: #fbf7ee; color: #241f17; }
    body.theme-dark { background: #161b22; color: #f0ece3; }
    #status {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 20px;
      min-height: 44px;
    }
    body.theme-light #status { color: #5c554a; }
    body.theme-dark #status { color: #9ca3af; }
    #diagram { padding: 4px 16px 16px; overflow-x: auto; }
    #diagram svg { max-width: 100%; height: auto; display: block; }
    #diagram pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
      margin: 0;
    }
    body.theme-light #diagram pre { color: #241f17; }
    body.theme-dark #diagram pre { color: #f0ece3; }
  </style>
</head>
<body class="theme-light">
  <div id="status" role="status" aria-live="polite">Preparando diagrama…</div>
  <div id="diagram"></div>
  <!-- Bundle local 11.16.1 (checksum en README.md) + wrapper sin bridge. -->
  <script src="mermaid.min.js"></script>
  <script src="explainer-mermaid.js"></script>
</body>
</html>
