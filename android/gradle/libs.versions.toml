# Catálogo congelado del baseline (global-constraints.md, 2026-08-08).
# NO cambiar versiones: cualquier incompatibilidad bloquea y se reporta.
# core-ktx 1.17.0 es elección propia (no fijada en el baseline): última estable
# coherente con compileSdk 36; 1.18+/1.19+ pueden exigir compileSdk 37.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"

coreKtx = "1.17.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# Lifecycle 2.10.0 es override estricto del grafo/BOM (decisión de baseline
# 2026-08-08, progress.md): sus AAR Compose declaran minCompileSdk=35 y el grupo
# atómico androidx.lifecycle debe alinearse a 2.10.0; NO puede reaparecer 2.11.x
# (exige compileSdk 37, no publicado) mientras compileSdk=36.
lifecycle = { strictly = "2.10.0" }
navigationCompose = "2.9.8"
datastore = "1.2.1"
workManager = "2.11.2"
room3 = "3.0.1"

supabase = "3.7.0"
ktor = "3.5.1"
kotlinxSerializationJson = "1.11.0"

# Markdown Renderer M3 0.41.0 estricto (decisión de baseline 2026-08-08,
# progress.md Decision ledger): sus AAR declaran minCompileSdk=36; 0.42.0 y
# 0.43.0 exigen compileSdk 37 (plataforma no publicada), por lo que NO son
# alternativas válidas mientras compileSdk=36. Rich version: strictly, no
# mera preferencia.
markdownRenderer = { strictly = "0.41.0" }
webkit = "1.16.0"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Compose (versiones gestionadas por el BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Lifecycle 2.10.0 estricto (ver [versions]); los tres artefactos se declaran
# directamente en :app (T05) para alinear el grupo atómico androidx.lifecycle.
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
# work-testing: solo test JVM (misma versión 2.11.2 del baseline) para
# construir WorkerParameters y verificar la custom WorkerFactory de T11 sin
# service locator ni Hilt. No entra en el APK.
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

# Room 3: namespace androidx.room3 intencional (no mezclar con Room 2).
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }

# Supabase: SOLO Auth (sin PostgREST/Storage/Realtime).
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth-kt = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }

# Ktor 3.x (engine Android; sin WebSockets en v1).
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Renderizado (T08): única librería Markdown (0.41.0 estricto, compileSdk 36)
# + WebView aislada para Mermaid (assets locales, sin CDN).
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NOTA: AGP 9 trae Kotlin built-in; el plugin kotlin-android NO se aplica.
# KGP 2.4.10 y KSP 2.3.11 se anclan en build.gradle.kts raíz vía buildscript.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
